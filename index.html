<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynasty League</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="kicker">OVERVIEW</div>
    <h1 id="league-name">Dynasty</h1>
    <div class="sub" id="league-sub"></div>
  </header>

  <main>
    <div class="grid">
      <section class="panel" id="p-standings"><div class="panel-b">Loading...</div></section>
      <section class="panel" id="p-week"><div class="panel-b">Loading...</div></section>
      <section class="panel" id="p-playoffs"><div class="panel-b">Loading...</div></section>
      <section class="panel" id="p-power"><div class="panel-b">Loading...</div></section>
      <section class="panel" id="p-trades"><div class="panel-b">Loading...</div></section>
      <section class="panel" id="p-highlights"><div class="panel-b">Loading...</div></section>
      <section class="panel" id="p-picks"><div class="panel-b">Loading...</div></section>
      <section class="panel" id="p-history"><div class="panel-b">Loading...</div></section>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
