<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team | Dynasty League</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ticker"><a href="standings.html">&larr; BACK TO STANDINGS</a></div>

  <header class="hero">
    <div class="kicker" id="team-kicker">TEAM</div>
    <h1 id="team-name">Loading...</h1>
    <div class="sub" id="team-sub"></div>
    <div class="stat-tiles" id="stat-tiles"></div>
  </header>

  <main>
    <section class="panel" id="p-key"><div class="panel-b">Loading...</div></section>

    <div class="team-grid">
      <section class="panel" id="p-squad"><div class="panel-b">Loading...</div></section>

      <div class="team-side">
        <section class="panel" id="p-fixtures"><div class="panel-b">Loading...</div></section>
        <section class="panel" id="p-ranks"><div class="panel-b">Loading...</div></section>
        <section class="panel" id="p-picks"><div class="panel-b">Loading...</div></section>
        <section class="panel" id="p-trades"><div class="panel-b">Loading...</div></section>
      </div>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="team.js"></script>
</body>
</html>
