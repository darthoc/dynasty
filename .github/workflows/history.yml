name: Check for big trades

on:
  schedule:
    # GitHub uses UTC. 12:00 UTC = 8 AM Eastern. 02:00 UTC = 10 PM Eastern the night before.
    - cron: "0 12 * * *"      # every day at 8 AM Eastern
    - cron: "0 2 * * 1,2,5"   # Sunday, Monday, Thursday nights at 10 PM Eastern
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look for new big trades
        run: node update-history.mjs
      - name: Save them to the repo
        run: |
          if [ -n "$(git status --porcelain history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json
            git commit -m "Save new big trade(s) to League History"
            git push
          fi
